<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plasmax AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card">

    <h1>🏭 Plasmax AI</h1>
<div class="card">
    <h3>📊 App Status</h3>
    <p>✅ Fault Database Ready</p>
    <p>🤖 AI Assistant Active</p>
    <p>📖 Manual Available</p>
</div>
    <p id="machineName">🏭 Machine: Not Selected</p>
    <p>Industrial Troubleshooting Assistant</p>

    <input type="file" id="imageInput" accept="image/*">

    <br><br>

    <button onclick="scanHMI()">📷 Scan HMI</button>

    <br><br>

    <input
        type="text"
        id="faultCode"
        placeholder="Enter Fault Code (Example: P1_OUTSIDE)">

    <br><br>

    <button onclick="searchFault()">🔍 Search Fault</button>

    <br><br>

    <div id="result" class="card" style="display:none; text-align:left;">

        <h2 id="faultTitle"></h2>

        <hr>

        <p>
            <strong>Cause</strong><br>
            <span id="faultCause"></span>
        </p>

        <p>
            <strong>Solution</strong><br>
            <span id="faultSolution"></span>
        </p>

    </div>

    <br>

    <button onclick="location.href='manual.html'">📖 Manual</button>

    <button onclick="location.href='ai.html'">🤖 AI Assistant</button>

    <button onclick="location.href='machine.html'">🏭 Select Machine</button>

    <button onclick="location.href='history.html'">📊 History</button>

    <button onclick="location.href='settings.html'">⚙️ Settings</button>

</div>
<script>
const machine = localStorage.getItem("machine");

if (machine) {
    document.getElementById("machineName").innerText =
        "🏭 Machine: " + machine;
}
</script>
<script src="faults.js"></script>
<script src="script.js"></script>

</body>
</html>

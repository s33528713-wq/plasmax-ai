
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Machine</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🏭 Select Machine</h1>

<select id="machine">
    <option>Plasmax EVO</option>
    <option>Plasmax Old</option>
</select>

<br><br>

<button onclick="saveMachine()">💾 Save Machine</button>

<br><br>

<button onclick="location.href='index.html'">🏠 Home</button>

<script>
function saveMachine() {
    const machine = document.getElementById("machine").value;
    localStorage.setItem("machine", machine);
    alert("✅ Machine Saved: " + machine);
}
</script>

</body>
</html>
